name: Katabump Auto Renew

on:
  schedule:
    # 每天定时自动运行（例如 UTC 0点和12点）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          npm install

      - name: Install Xray
        run: |
          # 先将脚本下载到本地 tmp，再通过 sudo 运行，避免 /dev/fd 管道权限丢失
          curl -sL https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/install-release.sh
          sudo bash /tmp/install-release.sh install --version v25.1.1

      - name: Run Auto Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          node action_renew.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          if-no-files-found: ignore
